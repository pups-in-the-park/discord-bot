[package]
name = "pitp-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pip"
path = "src/main.rs"

[workspace]
members = ["macros"]

[dependencies]
pip-macros = { path = "macros" }
# serenity `next` + poise `serenity-next`: the branches that deserialize modal
# components v2 (Label-wrapped inputs and selects-in-modals, inbound + outbound).
# Both reference serenity by `branch = "next"`, so Cargo unifies them on one commit;
# Cargo.lock pins the exact revs for reproducible builds.
poise = { git = "https://github.com/serenity-rs/poise", branch = "serenity-next" }
serenity = { git = "https://github.com/serenity-rs/serenity", branch = "next", features = ["cache", "gateway", "model", "http"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
